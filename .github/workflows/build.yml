name: Build Windows EXE

# Runs automatically whenever you push code,
# and can also be triggered manually from Actions.
on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install app dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build CanFallingDetector.exe
        working-directory: installer
        run: |
          pyinstaller `
            --name CanFallingDetector `
            --noconfirm `
            --windowed `
            --icon "../dotsec_logo.ico" `
            --add-data "../models;models" `
            --collect-all onnxruntime `
            --collect-all cv2 `
            --collect-all pymodbus `
            --collect-all serial `
            "../app/main.py"

      - name: Remove stale bundled MSVC runtime DLLs
        working-directory: installer/dist/CanFallingDetector
        run: |
          $staleDlls = @(
            "msvcp140.dll",
            "vcruntime140.dll",
            "vcruntime140_1.dll",
            "concrt140.dll"
          )

          foreach ($dll in $staleDlls) {
            $found = Get-ChildItem -Recurse -Filter $dll -ErrorAction SilentlyContinue

            foreach ($f in $found) {
              Write-Host "Removing bundled $($f.FullName)"
              Remove-Item $f.FullName -Force
            }
          }

      - name: Upload built application as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: CanFallingDetector-Windows
          path: installer/dist/CanFallingDetector/
          retention-days: 30
